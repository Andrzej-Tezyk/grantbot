services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATA_DIR: /app/data
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - chroma_db:/app/chroma_db
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  vector-init:
    build:
      context: .
    profiles: ["seed"]
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - chroma_db:/app/chroma_db
    command: ["uv", "run", "python", "scripts/init_vectordb.py"]
    restart: "no"

volumes:
  chroma_db: